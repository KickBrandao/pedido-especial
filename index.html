<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu amor 💜</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="coracoes"></div>

    <main class="container">

        <div id="tela-pergunta">
            <h1>Quer casar comigo?</h1>

            <div class="botoes">
                <button id="sim">Sim 💜</button>
                <button id="nao">Não</button>
            </div>
        </div>

        <div id="tela-erro" class="oculto">
            <h2 id="mensagem-erro"></h2>
            <button id="voltar">Voltar</button>
        </div>
        
        <div id="tela-sim" class="oculto">
            <h1>Eu te amo!</h1>
            <p>E sempre irei te amar. Você é a pessoa mais importante da minha vida</p>
            <p>e vamos mostrar nosso amor para todo o mundo.</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
